name: Linux acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Ubuntu / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install GCC and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Linux acceptance suite
        env:
          OJ_ACCEPTANCE_PYTHON: python
        run: ./scripts/linux_acceptance.sh
