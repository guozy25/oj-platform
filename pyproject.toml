[project]
name = "async-oj"
version = "0.1.0"
description = "Asynchronous Online Judge course project"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

